<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Martín Aberle</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --accent: #0a66c2;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border-radius: 20px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    .avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 32px;
      font-weight: 700;
    }
    h1 { font-size: 26px; margin-bottom: 6px; }
    .subtitle { color: var(--muted); margin-bottom: 28px; }
    #qr { display: flex; justify-content: center; margin-bottom: 12px; }
    #qr img, #qr canvas { border-radius: 8px; }
    .hint { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    .btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">MA</div>
    <h1>Martín Aberle</h1>
    <p class="subtitle">¡Gracias por pasar por el stand!</p>

    <div id="qr"></div>
    <p class="hint">Escaneá el código para conectar</p>

    <a class="btn" href="https://www.linkedin.com/in/martin-aberle/" target="_blank" rel="noopener">
      Ver mi LinkedIn
    </a>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    new QRCode(document.getElementById("qr"), {
      text: "https://www.linkedin.com/in/martin-aberle/",
      width: 180,
      height: 180
    });
  </script>
</body>
</html>
